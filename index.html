<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>代码年轮 - Git 提交历史可视化</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      color: #fff;
      overflow-x: hidden;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
      padding: 20px 0;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #4ecdc4, #45b7d1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: #aaa;
      font-size: 1.1em;
    }

    .input-area {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .token-group {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    input[type="text"],
    input[type="password"] {
      flex: 1;
      min-width: 200px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      color: #fff;
      font-size: 14px;
    }

    input[type="text"]::placeholder,
    input[type="password"]::placeholder {
      color: #888;
    }

    button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #4ecdc4, #45b7d1);
      border: none;
      border-radius: 4px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      white-space: nowrap;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(78, 205, 196, 0.3);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .token-status {
      font-size: 12px;
      color: #888;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .token-status.active {
      color: #4ecdc4;
    }

    .canvas-container {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 20px;
      aspect-ratio: 16 / 9;
      display: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .controls {
      display: none;
      gap: 10px;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .control-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    input[type="range"] {
      flex: 1;
      min-width: 100px;
    }

    button#cancelBtn[style*="display: none"] {
      display: none;
    }

    select {
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
    }

    .export-area {
      display: none;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .export-area button {
      background: linear-gradient(135deg, #f39c12, #e67e22);
    }

    .status {
      text-align: center;
      font-size: 14px;
      color: #aaa;
      min-height: 20px;
    }

    .error {
      background: rgba(255, 107, 107, 0.1);
      border: 1px solid rgba(255, 107, 107, 0.3);
      border-radius: 4px;
      padding: 12px;
      margin-bottom: 20px;
      color: #ff6b6b;
      display: none;
    }

    .presets {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
      margin-top: 20px;
      margin-bottom: 20px;
    }

    .preset-card {
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .preset-card:hover {
      background: rgba(78, 205, 196, 0.1);
      border-color: #4ecdc4;
      transform: translateY(-2px);
    }

    .preset-card div {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .preset-card strong {
      display: block;
      font-size: 12px;
      color: #888;
    }

    footer {
      text-align: center;
      padding: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      margin-top: 40px;
      color: #666;
      font-size: 12px;
    }

    a {
      color: #4ecdc4;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 1.8em;
      }

      .input-group,
      .token-group,
      .controls,
      .export-area {
        flex-direction: column;
      }

      input[type="text"],
      input[type="password"],
      button {
        width: 100%;
      }

      .control-group {
        width: 100%;
      }

      .presets {
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      }

      .token-status {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>代码年轮</h1>
      <p class="subtitle">用树形可视化展示 Git 仓库的提交历史</p>
    </header>

    <div class="input-area">
      <div class="input-group">
        <input
          type="text"
          id="repoInput"
          placeholder="输入 GitHub 仓库地址，如 facebook/react 或 https://github.com/facebook/react"
          aria-label="GitHub 仓库地址"
        />
        <button id="loadBtn">让它生长</button>
        <button id="cancelBtn" style="display: none;">⏹ 取消</button>
      </div>
      <div class="token-group">
        <input
          type="password"
          id="tokenInput"
          placeholder="(可选) GitHub Token - 提高 API 限额到 5000/小时"
          aria-label="GitHub Token"
          style="flex: 1; min-width: 200px;"
        />
        <button id="tokenToggleBtn" title="显示/隐藏 Token" style="padding: 12px 16px;">👁</button>
        <button id="tokenClearBtn" title="清除保存的 Token" style="padding: 12px 16px;">✕</button>
        <span id="tokenStatus" class="token-status">未设置</span>
      </div>
      <div class="status" id="status"></div>
    </div>

    <div id="errorBox" class="error"></div>

    <div id="presets" class="presets"></div>

    <div class="canvas-container" id="canvasContainer">
      <canvas id="canvas"></canvas>
    </div>

    <div class="controls" id="controls">
      <button id="playBtn">▶ 播放</button>
      <button id="pauseBtn">⏸ 暂停</button>
      <div class="control-group">
        <label>速度:</label>
        <select id="speedSelect">
          <option value="0.5">0.5x</option>
          <option value="1" selected>1x</option>
          <option value="2">2x</option>
          <option value="4">4x</option>
        </select>
      </div>
      <div class="control-group">
        <label>时长:</label>
        <select id="durationSelect">
          <option value="10">10s</option>
          <option value="30" selected>30s</option>
          <option value="60">60s</option>
        </select>
      </div>
      <div class="control-group">
        <input type="range" id="timeSlider" min="0" max="100" value="0" style="flex: 1; min-width: 200px;" />
        <span id="timeDisplay">00:00</span>
      </div>
    </div>

    <div class="export-area" id="exportArea">
      <button data-action="export-video" title="导出为 WebM 视频">📽 导出视频</button>
      <button data-action="export-card" title="导出为 PNG 纪念卡">🎴 导出纪念卡</button>
    </div>

    <footer>
      <p>代码年轮 © 2026 | <a href="https://github.com/yourusername/gittree" target="_blank">GitHub</a> | 快捷键: 空格播放 · ←→进度 · Home/End 跳转</p>
    </footer>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
