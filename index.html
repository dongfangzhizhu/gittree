<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>代码年轮 - Git 提交历史可视化</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      color: #fff;
      overflow-x: hidden;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
      padding: 20px 0;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #4ecdc4, #45b7d1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: #aaa;
      font-size: 1.1em;
    }

    .input-area {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      color: #fff;
      font-size: 14px;
    }

    input[type="text"]::placeholder {
      color: #888;
    }

    button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #4ecdc4, #45b7d1);
      border: none;
      border-radius: 4px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(78, 205, 196, 0.3);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .canvas-container {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 20px;
      aspect-ratio: 16 / 9;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .control-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    input[type="range"] {
      flex: 1;
      min-width: 100px;
    }

    select {
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
    }

    .status {
      text-align: center;
      font-size: 14px;
      color: #aaa;
      min-height: 20px;
    }

    .error {
      background: rgba(255, 107, 107, 0.1);
      border: 1px solid rgba(255, 107, 107, 0.3);
      border-radius: 4px;
      padding: 12px;
      margin-bottom: 20px;
      color: #ff6b6b;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #4ecdc4;
    }

    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #4ecdc4;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .presets {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
      margin-top: 20px;
    }

    .preset-card {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .preset-card:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .preset-card strong {
      display: block;
      margin-top: 8px;
      font-size: 12px;
    }

    footer {
      text-align: center;
      padding: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      margin-top: 40px;
      color: #666;
      font-size: 12px;
    }

    a {
      color: #4ecdc4;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>代码年轮</h1>
      <p class="subtitle">用树形可视化展示 Git 仓库的提交历史</p>
    </header>

    <div class="input-area">
      <div class="input-group">
        <input
          type="text"
          id="repoInput"
          placeholder="输入 GitHub 仓库地址，如 facebook/react 或 https://github.com/facebook/react"
          aria-label="GitHub 仓库地址"
        />
        <button id="loadBtn">让它生长</button>
      </div>
      <div class="status" id="status"></div>
    </div>

    <div id="errorBox" class="error" style="display: none;"></div>

    <div class="canvas-container" style="display: none;" id="canvasContainer">
      <canvas id="canvas"></canvas>
    </div>

    <div class="controls" style="display: none;" id="controls">
      <button id="playBtn">▶ 播放</button>
      <button id="pauseBtn">⏸ 暂停</button>
      <div class="control-group">
        <label>速度:</label>
        <select id="speedSelect">
          <option value="0.5">0.5x</option>
          <option value="1" selected>1x</option>
          <option value="2">2x</option>
          <option value="4">4x</option>
        </select>
      </div>
      <div class="control-group">
        <label>时长:</label>
        <select id="durationSelect">
          <option value="10">10s</option>
          <option value="30" selected>30s</option>
          <option value="60">60s</option>
        </select>
      </div>
      <div class="control-group">
        <input type="range" id="timeSlider" min="0" max="100" value="0" style="flex: 1; min-width: 200px;" />
        <span id="timeDisplay">00:00</span>
      </div>
    </div>

    <div id="presets" class="presets" style="display: none;"></div>

    <footer>
      <p>代码年轮 © 2026 | <a href="https://github.com/yourusername/gittree">GitHub</a></p>
    </footer>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
