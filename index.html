<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Visualize Git commit history as a growing 3D tree animation. Watch repositories evolve over time." />
  <meta name="theme-color" content="#0a0e27" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext x=%2250%22 y=%2290%22 font-size=%2280%22 text-anchor=%22middle%22%3E🌳%3C/text%3E%3C/svg%3E" />
  <title>代码年轮 - Git 提交历史三维可视化</title>
  <style>
    :root {
      --bg: #0a0e27;
      --bg-2: #101635;
      --panel: rgba(255, 255, 255, 0.045);
      --panel-strong: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.1);
      --accent: #4ecdc4;
      --accent-2: #45b7d1;
      --gold: #ffd700;
      --purple: #9b59b6;
      --text: #eef1f8;
      --dim: #8a92b2;
      --danger: #ff6b6b;
      --radius: 14px;
      --shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
      background:
        radial-gradient(1200px 600px at 85% -10%, rgba(78, 205, 196, 0.09), transparent 60%),
        radial-gradient(900px 500px at -10% 110%, rgba(69, 183, 209, 0.08), transparent 60%),
        linear-gradient(160deg, var(--bg) 0%, var(--bg-2) 100%);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app {
      max-width: 1440px;
      margin: 0 auto;
      padding: 22px 28px 40px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* ===== 顶栏 ===== */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      /* 吸顶：滚到树下也能随时导出 */
      position: sticky;
      top: 0;
      z-index: 60;
      padding: 10px 0 12px;
      margin: -10px 0 -4px;
      background: linear-gradient(180deg, rgba(10, 14, 39, 0.96) 55%, rgba(10, 14, 39, 0.7));
      backdrop-filter: blur(16px) saturate(140%);
      -webkit-backdrop-filter: blur(16px) saturate(140%);
      border-bottom: 1px solid rgba(126, 240, 230, 0.08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand .logo {
      font-size: 34px;
      filter: drop-shadow(0 4px 12px rgba(78, 205, 196, 0.35));
    }

    .brand h1 {
      font-size: 26px;
      letter-spacing: 1px;
      background: linear-gradient(120deg, #7ef0e6, var(--accent) 45%, var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand .tagline {
      font-size: 12.5px;
      color: var(--dim);
      margin-top: 2px;
      letter-spacing: 0.4px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .top-actions a {
      color: var(--dim);
      text-decoration: none;
      font-size: 13px;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      transition: color 0.2s, border-color 0.2s;
    }

    .top-actions a:hover {
      color: var(--accent);
      border-color: rgba(78, 205, 196, 0.45);
    }

    /* ===== 加载区 ===== */
    .loadbar {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .loadbar-row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .loadbar-row.secondary {
      justify-content: space-between;
    }

    input[type="text"],
    input[type="password"] {
      flex: 1;
      min-width: 220px;
      padding: 11px 14px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: rgba(78, 205, 196, 0.55);
      box-shadow: 0 0 0 3px rgba(78, 205, 196, 0.12);
    }

    input::placeholder {
      color: #6b7490;
    }

    button {
      padding: 11px 20px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border: none;
      border-radius: 10px;
      color: #062a28;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(78, 205, 196, 0.28);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button.ghost {
      background: var(--panel-strong);
      color: var(--text);
      border: 1px solid var(--border);
    }

    button.ghost:hover:not(:disabled) {
      border-color: rgba(78, 205, 196, 0.45);
      box-shadow: none;
    }

    #cancelBtn {
      background: rgba(255, 107, 107, 0.14);
      color: var(--danger);
      border: 1px solid rgba(255, 107, 107, 0.35);
    }

    /* 缓存开关 */
    .cache-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--dim);
      cursor: pointer;
      user-select: none;
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      transition: color 0.2s, border-color 0.2s;
    }

    .cache-toggle:hover {
      color: var(--text);
      border-color: rgba(78, 205, 196, 0.4);
    }

    .cache-toggle input {
      accent-color: var(--accent);
      width: 15px;
      height: 15px;
      cursor: pointer;
    }

    .cache-toggle.on {
      color: var(--accent);
      border-color: rgba(78, 205, 196, 0.5);
      background: rgba(78, 205, 196, 0.08);
    }

    .cache-status {
      font-size: 12px;
      color: var(--dim);
    }

    .cache-status .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(78, 205, 196, 0.14);
      color: var(--accent);
      margin-right: 6px;
      font-size: 11px;
    }

    .cache-status button {
      padding: 3px 10px;
      font-size: 11px;
      border-radius: 999px;
      margin-left: 6px;
    }

    /* Token 折叠区 */
    .token-details {
      font-size: 13px;
      color: var(--dim);
    }

    .token-details summary {
      cursor: pointer;
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      list-style: none;
      transition: color 0.2s, border-color 0.2s;
    }

    .token-details summary::-webkit-details-marker {
      display: none;
    }

    .token-details summary:hover {
      color: var(--text);
      border-color: rgba(78, 205, 196, 0.4);
    }

    .token-details[open] summary {
      color: var(--accent);
      border-color: rgba(78, 205, 196, 0.45);
    }

    .token-group {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .token-group input {
      flex: 1;
      min-width: 200px;
    }

    .token-group button {
      padding: 10px 14px;
    }

    .token-status {
      font-size: 12px;
      color: var(--dim);
    }

    .token-status.active {
      color: var(--accent);
    }

    .status {
      font-size: 13px;
      color: var(--dim);
      min-height: 18px;
    }

    .error {
      background: rgba(255, 107, 107, 0.1);
      border: 1px solid rgba(255, 107, 107, 0.35);
      border-radius: 10px;
      padding: 12px 16px;
      color: var(--danger);
      font-size: 13.5px;
      display: none;
    }

    /* ===== 预置 ===== */
    .presets {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .preset-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .preset-group-title {
      font-size: 12px;
      color: var(--dim);
      letter-spacing: 0.6px;
      padding-left: 2px;
    }

    .presets-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 12px;
    }

    .preset-card {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.2s, background 0.2s;
    }

    .preset-card:hover {
      transform: translateY(-2px);
      border-color: rgba(78, 205, 196, 0.5);
      background: rgba(78, 205, 196, 0.07);
    }

    .preset-card div {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .preset-card strong {
      display: block;
      font-size: 12px;
      color: var(--dim);
      font-weight: 400;
    }

    .preset-meta {
      display: block;
      margin-top: 7px;
      font-size: 11px;
      color: var(--accent);
      opacity: 0.85;
    }

    .preset-card.snapshot-card {
      background: linear-gradient(150deg, rgba(78, 205, 196, 0.06), rgba(255, 255, 255, 0.02));
    }

    /* 选中态：与未选中明确区分（描边 + 底色 + 光晕 + 勾选角标） */
    .preset-card.selected {
      border-color: var(--accent);
      background: linear-gradient(150deg, rgba(78, 205, 196, 0.22), rgba(69, 183, 209, 0.1));
      box-shadow: 0 0 0 1px rgba(78, 205, 196, 0.55), 0 10px 26px rgba(78, 205, 196, 0.18);
      transform: translateY(-2px);
    }

    .preset-card.selected::after {
      content: "✓";
      position: absolute;
      top: 8px;
      right: 8px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent);
      color: #04231f;
      font-size: 13px;
      font-weight: 900;
      line-height: 20px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(78, 205, 196, 0.5);
    }

    .preset-card.selected > div:first-child {
      color: #9ff2ea;
    }

    /* ===== 森林操作条 ===== */
    .forest-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
    }

    .forest-bar .forest-count {
      font-size: 13px;
      color: var(--dim);
    }

    .forest-bar .forest-count strong {
      color: var(--accent);
      font-size: 15px;
    }

    .forest-bar .forest-hint {
      font-size: 12px;
      color: var(--dim);
      opacity: 0.75;
      margin-left: auto;
    }

    .forest-bar button {
      padding: 9px 16px;
      font-size: 13px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel-strong);
      color: var(--text);
      cursor: pointer;
    }

    .forest-bar button.primary {
      background: linear-gradient(135deg, #7ef0e6, var(--accent));
      color: #04231f;
      font-weight: 800;
      border-color: transparent;
    }

    .forest-bar button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* ===== 三维名牌（跟随树的 HTML 标签） ===== */
    .tree-labels {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
    }

    .tree-label {
      position: absolute;
      transform: translate(-50%, -100%);
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(78, 205, 196, 0.35);
      background: rgba(6, 12, 26, 0.72);
      backdrop-filter: blur(6px);
      color: #cfe9e6;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      transition: opacity 0.2s, border-color 0.2s, box-shadow 0.2s, transform 0.2s;
      pointer-events: auto;
      cursor: pointer;
      user-select: none;
    }

    .tree-label:hover {
      border-color: rgba(78, 205, 196, 0.85);
      box-shadow: 0 4px 16px rgba(78, 205, 196, 0.28);
    }

    /* 焦点树的名牌高亮 */
    .tree-label.focused {
      border-color: var(--accent);
      background: linear-gradient(150deg, rgba(78, 205, 196, 0.92), rgba(69, 183, 209, 0.85));
      color: #04231f;
      box-shadow: 0 6px 20px rgba(78, 205, 196, 0.35);
    }

    .tree-label.focused .tree-commits {
      color: rgba(4, 35, 31, 0.72);
    }

    .tree-label .tree-commits {
      font-weight: 400;
      color: var(--dim);
      margin-left: 6px;
      font-size: 11px;
    }

    /* ===== 舞台 ===== */
    .stage {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .canvas-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      min-height: 480px;
      max-height: 76vh;
      background: radial-gradient(900px 480px at 50% 110%, rgba(78, 205, 196, 0.07), transparent 70%), var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      display: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    /* HUD 覆盖层 */
    .hud {
      position: absolute;
      pointer-events: none;
      z-index: 5;
    }

    .hud-tl {
      top: 16px;
      left: 18px;
    }

    .hud-chapter {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
    }

    .hud-date {
      font-size: 12.5px;
      color: var(--dim);
      margin-top: 3px;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
    }

    .hud-tr {
      top: 14px;
      right: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      pointer-events: auto;
      background: rgba(10, 14, 39, 0.55);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 10px;
      backdrop-filter: blur(10px);
    }

    .hud-label {
      font-size: 11px;
      color: var(--dim);
      padding: 0 4px;
    }

    .view-btn {
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 999px;
      background: transparent;
      color: var(--dim);
      border: 1px solid transparent;
    }

    .view-btn:hover {
      color: var(--text);
      box-shadow: none;
      transform: none;
    }

    .view-btn.active {
      color: #062a28;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }

    .rotate-toggle {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--dim);
      cursor: pointer;
      padding-left: 8px;
      border-left: 1px solid var(--border);
    }

    .rotate-toggle input {
      accent-color: var(--accent);
      width: 13px;
      height: 13px;
      cursor: pointer;
    }

    .hud-hint {
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: var(--dim);
      background: rgba(10, 14, 39, 0.5);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 16px;
      backdrop-filter: blur(8px);
      transition: opacity 0.3s;
    }

    /* 信息面板 */
    .info-panel {
      position: absolute;
      top: 64px;
      right: 14px;
      width: 300px;
      max-height: calc(100% - 120px);
      overflow-y: auto;
      background: rgba(13, 18, 46, 0.82);
      border: 1px solid rgba(78, 205, 196, 0.3);
      border-radius: 12px;
      padding: 14px 16px;
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow);
      z-index: 6;
      opacity: 0;
      transform: translateX(12px);
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
    }

    .info-panel.open {
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .panel-kind {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    .panel-close {
      padding: 2px 8px;
      font-size: 12px;
      background: transparent;
      color: var(--dim);
      border-radius: 6px;
    }

    .panel-close:hover {
      color: var(--text);
      box-shadow: none;
      transform: none;
    }

    .panel-title {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.45;
      word-break: break-all;
      margin-bottom: 10px;
    }

    .panel-meta {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 5px 12px;
      font-size: 12.5px;
    }

    .panel-meta dt {
      color: var(--dim);
    }

    .panel-meta dd {
      color: var(--text);
      word-break: break-all;
    }

    .panel-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .panel-actions button,
    .panel-actions a {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 8px;
      text-decoration: none;
      border: 1px solid rgba(78, 205, 196, 0.4);
      color: var(--accent);
      background: rgba(78, 205, 196, 0.1);
      cursor: pointer;
    }

    .panel-actions button:hover,
    .panel-actions a:hover {
      background: rgba(78, 205, 196, 0.2);
    }

    /* ===== 播放控制条 ===== */
    .controls {
      display: none;
      gap: 12px;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      backdrop-filter: blur(12px);
      flex-wrap: wrap;
    }

    .controls button {
      padding: 9px 16px;
    }

    .control-group {
      display: flex;
      gap: 6px;
      align-items: center;
      font-size: 12.5px;
      color: var(--dim);
    }

    .control-group label {
      white-space: nowrap;
    }

    select {
      padding: 7px 10px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 12.5px;
      cursor: pointer;
      outline: none;
    }

    input[type="range"] {
      flex: 1;
      min-width: 140px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .time-display {
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      color: var(--text);
      min-width: 44px;
      text-align: center;
    }

    /* ===== 导出区（顶栏） ===== */
    .export-area {
      display: none;
      gap: 8px;
      align-items: center;
    }

    .export-area button {
      padding: 9px 15px;
      font-size: 13px;
      background: linear-gradient(135deg, #f5b942, #e67e22);
      color: #3a2000;
    }

    .export-area button:hover:not(:disabled) {
      box-shadow: 0 8px 20px rgba(230, 126, 34, 0.3);
    }

    /* 音乐开关：与导出按钮同色系，开启时改青色高亮 */
    .export-area #midiBtn {
      background: linear-gradient(135deg, #b39ddb, #7e57c2);
      color: #1d0f38;
    }

    .export-area #midiBtn:hover:not(:disabled) {
      box-shadow: 0 8px 20px rgba(126, 87, 194, 0.35);
    }

    .export-area .music-btn {
      background: rgba(255, 255, 255, 0.08);
      color: var(--dim);
      border: 1px solid var(--border);
      min-width: 96px;
    }

    .export-area .music-btn.is-on {
      background: linear-gradient(135deg, #7ef0e6, var(--accent));
      color: #04231f;
      border-color: transparent;
      animation: music-pulse 2.4s ease-in-out infinite;
    }

    @keyframes music-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(78, 205, 196, 0.45); }
      50% { box-shadow: 0 0 0 6px rgba(78, 205, 196, 0); }
    }

    /* 画质档位开关：高=金 / 均衡=青 / 流畅=灰 */
    .export-area .quality-btn {
      background: linear-gradient(135deg, #ffe29a, #f5b942);
      color: #3a2a00;
      min-width: 92px;
    }

    .export-area .quality-btn[data-level="medium"] {
      background: linear-gradient(135deg, #9be8ff, #45b7d1);
      color: #05252e;
    }

    .export-area .quality-btn[data-level="low"] {
      background: rgba(255, 255, 255, 0.08);
      color: var(--dim);
      border: 1px solid var(--border);
    }

    /* 播放/暂停合并开关：固定宽度避免图标切换抖动 */
    .play-toggle {
      min-width: 98px;
      text-align: center;
    }

    footer {
      text-align: center;
      padding: 18px 0 4px;
      border-top: 1px solid var(--border);
      color: #5d6580;
      font-size: 12px;
      line-height: 1.8;
    }

    footer kbd {
      background: var(--panel-strong);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 1px 6px;
      font-size: 11px;
      font-family: inherit;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 900px) {
      .app {
        padding: 16px 14px 30px;
      }

      .canvas-container {
        min-height: 380px;
        aspect-ratio: auto;
        height: 60vh;
      }

      .hud-tr {
        top: 10px;
        right: 10px;
        max-width: calc(100% - 20px);
      }

      .info-panel {
        width: calc(100% - 28px);
        top: auto;
        bottom: 14px;
        right: 14px;
        max-height: 46%;
      }

      .controls {
        gap: 8px;
      }

      input[type="range"] {
        min-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo">🌳</span>
        <div>
          <h1>代码年轮</h1>
          <p class="tagline">Git 提交历史 · 三维生长可视化</p>
        </div>
      </div>
      <div class="top-actions">
        <div class="export-area" id="exportArea">
          <button data-action="export-video" title="导出为 WebM 视频">📽 导出视频</button>
          <button data-action="export-card" title="导出为 PNG 纪念卡">🎴 导出纪念卡</button>
          <button id="midiBtn" title="把这段生长音乐导出成标准 MIDI 文件（可拖进任意 DAW / 打谱软件）">🎹 导出 MIDI</button>
          <button id="musicBtn" class="music-btn" title="生长音乐：每个提交对应一个音（快捷键 M）">🔇 音乐关</button>
          <button id="qualityBtn" class="quality-btn" title="画质档位：掉帧时会自动降档，也可以手动切换">✨ 高画质</button>
        </div>
        <a href="https://github.com/dongfangzhizhu/gittree" target="_blank" rel="noopener">GitHub ↗</a>
      </div>
    </header>

    <section class="loadbar">
      <div class="loadbar-row">
        <input
          type="text"
          id="repoInput"
          placeholder="输入一个或多个仓库，如 facebook/react, vuejs/core（逗号分隔）"
          aria-label="GitHub 仓库地址，可输入多个"
        />
        <button id="loadBtn">让它生长</button>
        <button id="cancelBtn" class="ghost" style="display: none;">⏹ 取消</button>
      </div>
      <div class="loadbar-row secondary">
        <div class="loadbar-row" style="gap: 10px;">
          <label class="cache-toggle" id="cacheToggleLabel" title="勾选后，首次拉取的数据会保存在浏览器本地；再次加载同一仓库时直接使用缓存，不再请求 GitHub">
            <input type="checkbox" id="cacheToggle" />
            <span>缓存此项目数据</span>
          </label>
          <span id="cacheStatus" class="cache-status"></span>
        </div>
        <details class="token-details">
          <summary>GitHub Token（可选，限额 60→5000/小时）</summary>
          <div class="token-group">
            <input
              type="password"
              id="tokenInput"
              placeholder="ghp_...（仅保存在本地浏览器）"
              aria-label="GitHub Token"
            />
            <button id="tokenToggleBtn" class="ghost" title="显示/隐藏 Token">👁</button>
            <button id="tokenClearBtn" class="ghost" title="清除保存的 Token">✕</button>
            <span id="tokenStatus" class="token-status">未设置</span>
          </div>
        </details>
      </div>
      <div class="status" id="status"></div>
    </section>

    <div id="errorBox" class="error"></div>

    <section id="presets" class="presets"></section>

    <div class="forest-bar" id="forestBar">
      <span class="forest-count" id="forestCount">已选 <strong>0</strong> 个项目</span>
      <button id="growForestBtn" class="primary" disabled>🌱 生长这片森林</button>
      <button id="clearSelectionBtn" class="ghost">清空选择</button>
      <span class="forest-hint" id="forestHint">点卡片可多选；也可在上方输入多个仓库（逗号或换行分隔）</span>
    </div>

    <main class="stage">
      <div class="canvas-container" id="canvasContainer">
        <canvas id="canvas"></canvas>
        <div class="tree-labels" id="treeLabels"></div>

        <div class="hud hud-tl">
          <div class="hud-chapter" id="hudChapter">萌芽期</div>
          <div class="hud-date" id="hudDate">---- (UTC) · 进度 0%</div>
        </div>

        <div class="hud hud-tr">
          <span class="hud-label">视角</span>
          <button class="view-btn active" data-view="overview">全景</button>
          <button class="view-btn" data-view="side">侧视</button>
          <button class="view-btn" data-view="top">俯视</button>
          <button class="view-btn" data-view="root">根颈</button>
          <label class="rotate-toggle" title="相机绕树自动旋转">
            <input type="checkbox" id="autoRotate" /> 自动旋转
          </label>
        </div>

        <aside class="info-panel" id="infoPanel"></aside>

        <div class="hud hud-hint" id="pickHint">💡 点击树叶或果实查看详情 · 拖动旋转视角 · 滚轮缩放</div>
      </div>

      <div class="controls" id="controls">
        <button id="playPauseBtn" class="play-toggle" title="空格键切换">⏸ 暂停</button>
        <input type="range" id="timeSlider" min="0" max="100" value="0" aria-label="生长进度" />
        <span id="timeDisplay" class="time-display">00:00</span>
        <div class="control-group">
          <label for="speedSelect">速度</label>
          <select id="speedSelect">
            <option value="0.5">0.5x</option>
            <option value="1" selected>1x</option>
            <option value="2">2x</option>
            <option value="4">4x</option>
          </select>
        </div>
        <div class="control-group">
          <label for="durationSelect">时长</label>
          <select id="durationSelect">
            <option value="10">10s</option>
            <option value="30" selected>30s</option>
            <option value="60">60s</option>
          </select>
        </div>
      </div>
    </main>

    <footer>
      <p>快捷键：<kbd>空格</kbd> 播放/暂停 · <kbd>←</kbd><kbd>→</kbd> 进度 · <kbd>Home</kbd>/<kbd>End</kbd> 跳转首尾</p>
      <p>代码年轮 © 2026 · 数据来自 GitHub REST API · <a href="https://github.com/dongfangzhizhu/gittree" target="_blank" rel="noopener">GitHub</a></p>
    </footer>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
